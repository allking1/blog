version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: blog_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: blog_db
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:

# Cách set up docker chạy database,
# cấu hình POM, thêm dependencies: SQL driver, Hibernate,....
# Viết Docker-compose: version, image, tạo tài khoản database, đục cổng giao tiếp, tạo volumes
# Thêm các thông tin vào file application.properties
# Chỉnh code: @Repository, @Entity,...
# Khởi động Docker Engine, run container : docker-compose up -d
# Chạy dự án như bình thường