<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        /* CSS tương tự file index, thêm nút bấm */
        * { box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .mockup-container { background-color: white; border: 3px solid #222; border-radius: 6px; width: 100%; max-width: 800px; padding: 20px 25px; }
        .top-nav { display: flex; justify-content: space-between; border-bottom: 2px solid #222; padding-bottom: 10px; margin-bottom: 20px; }
        button, .btn { border: 2px solid #222; background: white; padding: 5px 10px; border-radius: 4px; font-family: inherit; font-weight: bold; cursor: pointer; text-decoration: none; color: black; font-size: 14px;}
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { border: 2px solid #222; padding: 10px; text-align: left; }
        /* Thêm vào cuối thẻ <style> hiện tại của bạn */
        .tag {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            border: 2px solid #222;
            display: inline-block;
        }
        .tag-published {
            background-color: #a3e635; /* Màu xanh lá nhạt */
        }
        .tag-scheduled {
            background-color: #fde047; /* Màu vàng nhạt */
        }
    </style>
</head>
<body>
<div class="mockup-container">
    <div class="top-nav">
        <h2>Admin Dashboard</h2>
        <div>
            <a href="/admin/editor.html" class="btn">+ New Article</a>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>Title</th>
            <th>Status</th> <!-- Thêm cột này -->
            <th>Publish Date</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="tableBody">
        <!-- Data đổ bằng JS -->
        </tbody>
    </table>
</div>

<script>
    async function loadAdminArticles() {
        const response = await fetch('/api/admin/articles');

        // XỬ LÝ BẢO MẬT: Nếu Backend trả 401 -> Hết hạn Session hoặc Chưa đăng nhập
        if (response.status === 401) {
            window.location.href = '/login.html';
            return;
        }

        const articles = await response.json();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        articles.forEach(article => {
    // 1. Tạo biến chứa HTML của tag
    let statusTagHTML = '';

    // 2. Chuyển đổi chuỗi publishDate từ Backend thành đối tượng Date trong Javascript
    const publishDateObj = new Date(article.publishDate);
    const currentDate = new Date(); // Lấy thời gian hiện tại của máy tính/trình duyệt

    // 3. Logic kiểm tra (GIẢ ĐỊNH DỰA VÀO THỜI GIAN)
    if (publishDateObj > currentDate) {
        // Nếu ngày đăng ở trong tương lai -> Lên lịch
        statusTagHTML = '<span class="tag tag-scheduled">Scheduled</span>';
    } else {
        // Nếu ngày đăng đã qua -> Đã xuất bản
        statusTagHTML = '<span class="tag tag-published">Published</span>';
    }

    // 4. Đổ dữ liệu vào hàng (thêm thẻ <td> chứa tag)
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td><a href="/admin/detail.html?id=${article.id}">${article.title}</a></td>
        <td>${statusTagHTML}</td> <!-- Cột Status mới -->
        <td>${article.publishDate.replace('T', ' ')}</td>
        <td>
            <a href="/admin/editor.html?id=${article.id}" class="btn">Edit</a>
            <button class="btn" style="color:red;" onclick="deleteArticle('${article.id}')">Delete</button>
        </td>
    `;
    tbody.appendChild(tr);
});
    }

    async function deleteArticle(id) {
        if(confirm('Bạn có chắc muốn xóa bài này?')) {
            await fetch(`/api/admin/articles/${id}`, { method: 'DELETE' });
            loadAdminArticles(); // Tải lại bảng sau khi xóa
        }
    }

    async function logout() {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/login.html';
    }

    loadAdminArticles();
</script>
</body>
</html>
