<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        /* CSS tương tự file index, thêm nút bấm */
        * { box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .mockup-container { background-color: white; border: 3px solid #222; border-radius: 6px; width: 100%; max-width: 800px; padding: 20px 25px; }
        .top-nav { display: flex; justify-content: space-between; border-bottom: 2px solid #222; padding-bottom: 10px; margin-bottom: 20px; }
        button, .btn { border: 2px solid #222; background: white; padding: 5px 10px; border-radius: 4px; font-family: inherit; font-weight: bold; cursor: pointer; text-decoration: none; color: black; font-size: 14px;}
        .table { width: 100%; border-collapse: collapse; }
        .table th, .table td { border: 2px solid #222; padding: 10px; text-align: left; }
    </style>
</head>
<body>
<div class="mockup-container">
    <div class="top-nav">
        <h2>Admin Dashboard</h2>
        <div>
            <a href="/admin/editor.html" class="btn">+ New Article</a>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>Title</th>
            <th>Publish Date</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody id="tableBody">
        <!-- Data đổ bằng JS -->
        </tbody>
    </table>
</div>

<script>
    async function loadAdminArticles() {
        const response = await fetch('/api/admin/articles');

        // XỬ LÝ BẢO MẬT: Nếu Backend trả 401 -> Hết hạn Session hoặc Chưa đăng nhập
        if (response.status === 401) {
            window.location.href = '/login.html';
            return;
        }

        const articles = await response.json();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        articles.forEach(article => {
            const tr = document.createElement('tr');
            // Nút Edit dẫn sang editor.html kèm ID
            tr.innerHTML = `
                <td><a href="/admin/detail.html?id=${article.id}">${article.title}</a></td>
                <td>${article.publishDate.replace('T', ' ')}</td>
                <td>
                    <a href="/admin/editor.html?id=${article.id}" class="btn">Edit</a>
                    <button class="btn" style="color:red;" onclick="deleteArticle('${article.id}')">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function deleteArticle(id) {
        if(confirm('Bạn có chắc muốn xóa bài này?')) {
            await fetch(`/api/admin/articles/${id}`, { method: 'DELETE' });
            loadAdminArticles(); // Tải lại bảng sau khi xóa
        }
    }

    async function logout() {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/login.html';
    }

    loadAdminArticles();
</script>
</body>
</html>
