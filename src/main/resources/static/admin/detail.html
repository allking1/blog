<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin - Preview Article</title>
    <!-- ... CSS giữ nguyên như các file trước ... -->
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .mockup-container { background-color: white; border: 3px solid #222; border-radius: 6px; width: 100%; max-width: 600px; padding: 20px 25px; }
        .date { font-size: 14px; color: #666; font-style: italic; border-bottom: 2px dashed #222; padding-bottom: 10px; margin-bottom: 20px;}
        .content { white-space: pre-wrap; line-height: 1.6; }
        .btn { border: 2px solid #222; background: white; padding: 5px 10px; border-radius: 4px; font-family: inherit; font-weight: bold; cursor: pointer; text-decoration: none; color: black; font-size: 14px;}
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;}
    </style>
</head>
<body>
<div class="mockup-container">
    <div class="top-nav">
        <a href="/admin/dashboard.html" style="color:#555; text-decoration:none;">← Back to Dashboard</a>
        <!-- Nút sửa nhanh bài viết -->
        <a href="#" id="editBtn" class="btn">Edit Article</a>
    </div>

    <h1 id="title">Loading...</h1>
    <div class="date" id="date"></div>
    <div class="content" id="content"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('id');

    async function loadAdminDetail() {
        // GỌI API DÀNH RIÊNG CHO ADMIN (Lấy được cả bài chưa Publish)
        const response = await fetch(`/api/admin/articles/${articleId}`);

        if (response.status === 401) {
            window.location.href = '/login.html';
            return;
        }

        if (response.ok) {
            const article = await response.json();
            document.getElementById('title').innerText = '[PREVIEW] ' + article.title;
            document.getElementById('date').innerText = 'Publish Date: ' + article.publishDate.replace('T', ' ');
            document.getElementById('content').innerText = article.content;

            // Gắn link cho nút Edit
            document.getElementById('editBtn').href = `/admin/editor.html?id=${article.id}`;
        } else {
            document.getElementById('title').innerText = 'Không tìm thấy bài viết!';
        }
    }

    if(articleId) loadAdminDetail();
</script>
</body>
</html>
