<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Editor</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .mockup-container { background-color: white; border: 3px solid #222; border-radius: 6px; width: 100%; max-width: 600px; padding: 20px 25px; }
        .form-group { margin-bottom: 15px; }
        input, textarea { width: 100%; border: 3px solid #222; border-radius: 4px; padding: 10px; font-family: inherit; font-size: 15px; }
        textarea { height: 200px; resize: vertical; }
        button { border: 3px solid #222; background: white; padding: 10px; border-radius: 4px; font-family: inherit; font-weight: bold; cursor: pointer; width: 100%; }
        .error-box { background-color: #ffe6e6; border: 2px solid red; padding: 10px; color: red; font-weight: bold; margin-bottom: 15px; display: none; }

        /* CSS cho nút Set Time mới */
        .btn-now { width: auto; padding: 4px 10px; font-size: 12px; border: 2px solid #222; background: #e0f2fe; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-now:hover { background: #bae6fd; }
    </style>
</head>
<body>
<div class="mockup-container">
    <a href="/admin/dashboard.html" style="color:#555; text-decoration:none;">← Back</a>

    <h1 id="pageTitle">New Article</h1>

    <!-- Hộp hiển thị lỗi -->
    <div id="errorBox" class="error-box"></div>

    <form id="editorForm">
        <div class="form-group">
            <input type="text" id="title" placeholder="Title" required>
        </div>

        <div class="form-group">
            <label style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                <span>Publish Date:</span>
                <!-- Nút này thay thế hoàn hảo cho nút Today bất lực của trình duyệt -->
                <button type="button" id="btnSetNow" class="btn-now">⏰ Set to Now</button>
            </label>
            <input type="datetime-local" id="publishDate" required>
        </div>

        <div class="form-group">
            <textarea id="content" placeholder="Content" required></textarea>
        </div>
        <button type="submit" id="submitBtn">Save</button>
    </form>
</div>

<script>
    // 1. NHẬN DIỆN CHẾ ĐỘ
    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('id');
    const isEditMode = (articleId !== null);

    if (isEditMode) {
        document.getElementById('pageTitle').innerText = 'Edit Article';
        document.getElementById('submitBtn').innerText = 'Update';
        loadArticleData();
    }

    // 2. NẾU LÀ CHẾ ĐỘ SỬA -> Đổ dữ liệu cũ
    async function loadArticleData() {
        const response = await fetch(`/api/admin/articles/${articleId}`);
        if(response.status === 401) { window.location.href = '/login.html'; return; }

        const article = await response.json();
        document.getElementById('title').value = article.title;
        document.getElementById('publishDate').value = article.publishDate;
        document.getElementById('content').value = article.content;

        // Khóa ngày nếu bài đã xuất bản
        const now = new Date();
        const pubDate = new Date(article.publishDate);
        if (pubDate <= now) {
            document.getElementById('publishDate').readOnly = true;
            document.getElementById('publishDate').style.backgroundColor = '#eee';
            // Ẩn luôn nút Set to Now cho an toàn
            document.getElementById('btnSetNow').style.display = 'none';
        }
    }

    // 3. XỬ LÝ NÚT LẤY GIỜ HIỆN TẠI (Giải quyết triệt để vấn đề Ngày + Giờ)
    document.getElementById('btnSetNow').addEventListener('click', () => {
        const dateInput = document.getElementById('publishDate');
        if (dateInput.readOnly) return;

        // Thuật toán lấy giờ Local máy tính và format đúng chuẩn YYYY-MM-DDThh:mm
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        dateInput.value = now.toISOString().slice(0, 16);
    });

    // 4. XỬ LÝ LƯU BÀI (Gửi API)
    document.getElementById('editorForm').onsubmit = async (e) => {
        e.preventDefault();

        const payload = {
            title: document.getElementById('title').value,
            publishDate: document.getElementById('publishDate').value,
            content: document.getElementById('content').value
        };

        const apiUrl = isEditMode ? `/api/admin/articles/${articleId}` : '/api/admin/articles';
        const apiMethod = isEditMode ? 'PUT' : 'POST';

        const response = await fetch(apiUrl, {
            method: apiMethod,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const errorBox = document.getElementById('errorBox');

        if (response.ok) {
            window.location.href = '/admin/dashboard.html';
        } else if (response.status === 400) {
            const errorData = await response.json();
            let errorMsg = errorData.error ? errorData.error : Object.values(errorData).join('<br>');
            errorBox.innerHTML = '❌ ' + errorMsg;
            errorBox.style.display = 'block';
        } else if (response.status === 401) {
            window.location.href = '/login.html';
        }
    };
</script>
</body>
</html>
