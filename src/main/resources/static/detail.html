<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Article Detail</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; }
        .mockup-container { background-color: white; border: 3px solid #222; border-radius: 6px; width: 100%; max-width: 600px; padding: 20px 25px; }
        .date { font-size: 14px; color: #666; font-style: italic; border-bottom: 2px dashed #222; padding-bottom: 10px; margin-bottom: 20px;}
        .content { white-space: pre-wrap; line-height: 1.6; }
    </style>
</head>
<body>
<div class="mockup-container">
    <a href="javascript:history.back()" style="color:#555; text-decoration:none;">← Back</a>

    <h1 id="title">Loading...</h1>
    <div class="date" id="date"></div>
    <div class="content" id="content"></div>
</div>

<script>
    // Lấy ID từ URL (VD: detail.html?id=123)
    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('id');

    async function loadDetail() {
        // Dùng API public của Guest. Nếu Admin muốn xem thì API public vẫn nhả data bình thường (nếu đã publish)
        const response = await fetch(`/api/articles/${articleId}`);
        if (response.ok) {
            const article = await response.json();
            document.getElementById('title').innerText = article.title;
            document.getElementById('date').innerText = 'Published: ' + article.publishDate.replace('T', ' ');
            document.getElementById('content').innerText = article.content;
        } else {
            document.getElementById('title').innerText = 'Bài viết không tồn tại hoặc chưa xuất bản!';
        }
    }

    if(articleId) loadDetail();
</script>
</body>
</html>
