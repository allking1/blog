<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 50px 20px; }
        .mockup-container { background-color: white; border: 3px solid #222; border-radius: 6px; width: 100%; max-width: 400px; padding: 20px 25px; text-align: center; }
        input { width: 100%; border: 3px solid #222; border-radius: 4px; padding: 10px; margin-bottom: 15px; font-family: inherit; font-size: 15px; }
        button { border: 3px solid #222; background: white; padding: 10px; border-radius: 4px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background-color: #eee; }
        .error { color: red; font-weight: bold; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>
<div class="mockup-container">
    <h1>Admin Login</h1>
    <div id="errorMsg" class="error"></div>
    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <p><a href="/" style="color: #555;">← Về trang chủ</a></p>
</div>

<script>
    document.getElementById('loginForm').onsubmit = async (e) => {
        e.preventDefault(); // Chặn load lại trang

        // Ép dữ liệu thành Form-Data để Spring Boot Security hiểu được
        const formData = new URLSearchParams();
        formData.append('username', document.getElementById('username').value);
        formData.append('password', document.getElementById('password').value);

        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        });

        if (response.ok) {
            window.location.href = '/admin/dashboard.html'; // Đăng nhập thành công -> Vào dashboard
        } else {
            const errorData = await response.json();
            const errDiv = document.getElementById('errorMsg');
            errDiv.innerText = errorData.error;
            errDiv.style.display = 'block';
        }
    };
</script>
</body>
</html>
