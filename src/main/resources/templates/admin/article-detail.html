<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - View Article</title>
    <!-- CSS y hệt bản Guest -->
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .mockup-container { background-color: white; border: 3px solid #222; border-radius: 6px; width: 100%; max-width: 500px; padding: 20px 25px; }
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .back-link { color: #555; text-decoration: none; font-size: 14px; }
        h1 { font-size: 26px; margin: 0 0 5px 0; color: #222; }
        .article-meta { color: #999; font-size: 14px; margin-bottom: 25px; display: block; }
        .article-content { font-size: 17px; line-height: 1.6; white-space: pre-wrap; }
    </style>
</head>
<body>
<div class="mockup-container">
    <div class="top-nav">
        <a th:href="@{/admin}" class="back-link">← Back to Dashboard</a>
    </div>
    <h1 th:text="${article.title}">Title</h1>
    <span class="article-meta">
            Publish: <span th:text="${#temporals.format(article.publishDate, 'dd/MM/yyyy HH:mm')}"></span>
        </span>
    <div class="article-content" th:text="${article.content}">Content</div>
</div>
</body>
</html>
