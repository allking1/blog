<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .mockup-container { background-color: white; border: 3px solid #222; border-radius: 6px; width: 100%; max-width: 500px; padding: 20px 25px; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { font-size: clamp(24px, 6vw, 28px); margin: 0; color: #222; }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .add-btn { text-decoration: none; color: #222; font-weight: bold; font-size: 16px; white-space: nowrap; }
        .logout-btn { background: none; border: none; font-family: inherit; font-size: 16px; font-weight: bold; color: #d9534f; cursor: pointer; padding: 0; }

        .article-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; }
        .article-title { font-size: 16px; font-weight: bold; color: #222; flex: 1; word-break: break-word; text-decoration: none; }
        .article-title:hover { text-decoration: underline; }
        .status { font-size: 12px; padding: 2px 5px; border-radius: 4px; font-weight: bold; }
        .status.pub { background: #dff0d8; color: #3c763d; }
        .status.draft { background: #fcf8e3; color: #8a6d3b; }

        .action-links { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .action-links a, .action-links button { text-decoration: none; font-size: 14px; font-weight: bold; font-family: inherit; background: none; border: none; cursor: pointer; padding: 0; color: #aaa; }
        .action-links a:hover, .action-links button:hover { color: #222; }
        form.inline-form { margin: 0; padding: 0; display: flex; align-items: center; }
    </style>
</head>
<body>
<div class="mockup-container">
    <div class="header-row">
        <h1>Admin Panel</h1>
        <div class="header-actions">
            <a th:href="@{/admin/new}" class="add-btn">+ Add</a>
            <form th:action="@{/logout}" method="post" class="inline-form">
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
    </div>

    <div th:each="article : ${articles}" class="article-row">
        <div>
            <a th:href="@{'/admin/article/' + ${article.id}}" class="article-title" th:text="${article.title}">Title</a>
            <!-- Hiển thị badge trạng thái -->
            <span th:if="${!article.publishDate.isAfter(#temporals.createNow())}" class="status pub">Published</span>
            <span th:if="${article.publishDate.isAfter(#temporals.createNow())}" class="status draft">Scheduled</span>
        </div>

        <div class="action-links">
            <a th:href="@{'/admin/edit/' + ${article.id}}">Edit</a>
            <form th:action="@{'/admin/delete/' + ${article.id}}" method="post" class="inline-form" onsubmit="return confirm('Delete this?');">
                <button type="submit">Delete</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
