<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Article</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .mockup-container { background-color: white; border: 3px solid #222; border-radius: 6px; width: 100%; max-width: 500px; padding: 20px 25px; }
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .back-link { color: #555; text-decoration: none; font-size: 14px; }
        h1 { font-size: 26px; margin: 0 0 20px 0; }
        .form-group { margin-bottom: 15px; width: 100%; }
        input[type="text"], input[type="datetime-local"], textarea { width: 100%; border: 3px solid #222; border-radius: 4px; padding: 10px; font-family: inherit; font-size: 15px; }
        textarea { height: 200px; resize: vertical; }
        .submit-btn { border: 3px solid #222; background: white; padding: 10px; border-radius: 4px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        .locked-msg { color: #d9534f; font-size: 13px; font-style: italic; }
        .error-msg { color: #d9534f; font-size: 14px; font-weight: bold; margin-top: 5px; display: none; }
    </style>
</head>
<body>
<div class="mockup-container">
    <div class="top-nav">
        <a th:href="@{/admin}" class="back-link">← Back</a>
    </div>
    <h1>Update Article</h1>

    <!-- TRƯỜNG HỢP 1: BÀI ĐÃ PUBLISH (Không cần check JS vì ngày đã bị khóa) -->
    <form th:if="${isPublished}" th:action="@{'/admin/edit/published/' + ${article.id}}" method="post">
        <div class="form-group">
            <input type="text" name="title" th:value="${article.title}" required>
        </div>
        <div class="form-group">
            <label style="font-size: 14px; font-weight: bold; display:block; margin-bottom: 5px;">Publish Date: <span class="locked-msg">(Locked)</span></label>
            <input type="datetime-local" th:value="${#temporals.format(article.publishDate, 'yyyy-MM-dd''T''HH:mm')}" readonly style="background-color: #eee; cursor: not-allowed;">
        </div>
        <div class="form-group">
            <textarea name="content" th:text="${article.content}" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Update</button>
    </form>

    <!-- TRƯỜNG HỢP 2: BÀI CHƯA PUBLISH (Gắn hàm validateDate vào form) -->
    <form th:unless="${isPublished}" th:action="@{'/admin/edit/unPublished/' + ${article.id}}" method="post" onsubmit="return validateDate(event)">
        <div class="form-group">
            <input type="text" name="title" th:value="${article.title}" required>
        </div>
        <div class="form-group">
            <label style="font-size: 14px; font-weight: bold; display:block; margin-bottom: 5px;">Publish Date:</label>
            <input type="datetime-local" id="editPublishDateInput" name="publishDate" th:value="${#temporals.format(article.publishDate, 'yyyy-MM-dd''T''HH:mm')}" required>
            <!-- Dòng chữ đỏ báo lỗi -->
            <div id="edit-date-error" class="error-msg">❌ Publish Date không được nằm trong quá khứ!</div>
        </div>
        <div class="form-group">
            <textarea name="content" th:text="${article.content}" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Update</button>
    </form>
</div>

<!-- Script chặn Submit nếu sai ngày (Cho form Chưa publish) -->
<script>
    function validateDate(event) {
        const inputElement = document.getElementById("editPublishDateInput");
        if(!inputElement) return true; // Nếu form 1 render, form 2 không có mặt, bỏ qua check

        const dateInput = inputElement.value;
        if (!dateInput) return true;

        const selectedDate = new Date(dateInput);
        const now = new Date();
        now.setSeconds(0, 0);

        if (selectedDate < now) {
            event.preventDefault();
            document.getElementById("edit-date-error").style.display = "block";
            return false;
        } else {
            document.getElementById("edit-date-error").style.display = "none";
            return true;
        }
    }
</script>
</body>
</html>
