<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Article</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .mockup-container { background-color: white; border: 3px solid #222; border-radius: 6px; width: 100%; max-width: 500px; padding: 20px 25px; }
        .top-nav { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .back-link { color: #555; text-decoration: none; font-size: 14px; }
        h1 { font-size: 26px; margin: 0 0 20px 0; }
        .form-group { margin-bottom: 15px; width: 100%; }
        input[type="text"], input[type="datetime-local"], textarea { width: 100%; border: 3px solid #222; border-radius: 4px; padding: 10px; font-family: inherit; font-size: 15px; }
        textarea { height: 200px; resize: vertical; }
        .submit-btn { border: 3px solid #222; background: white; padding: 10px; border-radius: 4px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        .error-msg { color: #d9534f; font-size: 14px; font-weight: bold; margin-top: 5px; display: none; } /* Mặc định ẩn */
    </style>
</head>
<body>
<div class="mockup-container">
    <div class="top-nav">
        <a th:href="@{/admin}" class="back-link">← Back</a>
    </div>
    <h1>New Article</h1>

    <!-- Gọi hàm validateDate() khi người dùng bấm Submit -->
    <form th:action="@{/admin/new}" method="post" onsubmit="return validateDate(event)">
        <div class="form-group">
            <input type="text" name="title" placeholder="Title" required>
        </div>
        <div class="form-group">
            <label style="font-size: 14px; font-weight: bold; display:block; margin-bottom: 5px;">Publish Date:</label>
            <input type="datetime-local" id="publishDateInput" name="publishDate" required>
            <!-- Dòng chữ đỏ báo lỗi -->
            <div id="date-error" class="error-msg">❌ Publish Date không được nằm trong quá khứ!</div>
        </div>
        <div class="form-group">
            <textarea name="content" placeholder="Content" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Publish</button>
    </form>
</div>

<!-- Script chặn Submit nếu sai ngày -->
<script>
    function validateDate(event) {
        const dateInput = document.getElementById("publishDateInput").value;
        if (!dateInput) return true; // Để HTML5 tự validate require

        // Lấy thời gian người dùng chọn
        const selectedDate = new Date(dateInput);

        // Lấy thời gian hiện tại và gọt bỏ số giây (cho giống logic Backend)
        const now = new Date();
        now.setSeconds(0, 0);

        if (selectedDate < now) {
            event.preventDefault(); // CHẶN KHÔNG CHO FORM GỬI ĐI
            document.getElementById("date-error").style.display = "block"; // HIỆN CHỮ ĐỎ
            return false;
        } else {
            document.getElementById("date-error").style.display = "none";
            return true;
        }
    }
</script>
</body>
</html>
