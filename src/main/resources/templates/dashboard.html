<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .mockup-container { background-color: white; border: 3px solid #222; border-radius: 6px; width: 100%; max-width: 500px; padding: 20px 25px; }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { font-size: clamp(24px, 6vw, 28px); margin: 0; color: #222; }
        .add-btn { text-decoration: none; color: #222; font-weight: bold; font-size: 16px; white-space: nowrap; }
        .add-btn:hover { text-decoration: underline; }

        /* Chỉnh lại Flexbox để fix lỗi lệch trục */
        .article-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; }
        .article-title { font-size: 16px; font-weight: bold; color: #222; flex: 1; word-break: break-word; }

        .action-links { display: flex; align-items: center; gap: 15px; flex-shrink: 0; }

        .action-links a, .action-links button { text-decoration: none; font-size: 15px; font-weight: bold; font-family: inherit; background: none; border: none; cursor: pointer; padding: 0; margin: 0; display: inline-block; }
        .action-links .edit { color: #aaa; }
        .action-links .delete { color: #aaa; }
        .action-links .edit:hover, .action-links .delete:hover { color: #222; }

        /* Reset form margin làm lệch nút Delete */
        form.inline-form { margin: 0; padding: 0; display: flex; align-items: center; }
    </style>
</head>
<body>
<div class="mockup-container">
    <div class="header-row">
        <h1>Personal Blog</h1>
        <a th:href="@{/admin/new}" class="add-btn">+ Add</a>
    </div>
    <div th:each="article : ${articles}" class="article-row">
        <span class="article-title" th:text="${article.title}">My first article</span>
        <div class="action-links">
            <a th:href="@{'/admin/edit/' + ${article.id}}" class="edit">Edit</a>
            <form th:action="@{'/admin/delete/' + ${article.id}}" method="post" class="inline-form" onsubmit="return confirm('Bạn có chắc muốn xóa bài này?');">
                <button type="submit" class="delete">Delete</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
