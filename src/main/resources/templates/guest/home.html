<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest - Blog</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #fafafa; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .mockup-container { background-color: white; border: 3px solid #222; border-radius: 6px; width: 100%; max-width: 500px; padding: 20px 25px; }
        h1 { font-size: clamp(24px, 6vw, 32px); margin: 0 0 25px 0; color: #222; }
        .article-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 15px; }
        .article-title { text-decoration: none; color: #222; font-size: 18px; font-weight: bold; flex: 1; word-break: break-word; }
        .article-title:hover { text-decoration: underline; }
        .article-date { color: #999; font-size: 15px; font-weight: bold; flex-shrink: 0; }
        .empty-msg { color: #777; font-style: italic; }
    </style>
</head>
<body>
<div class="mockup-container">
    <h1>Personal Blog</h1>
    <div th:if="${#lists.isEmpty(articles)}" class="empty-msg"><p>No articles yet.</p></div>
    <div th:each="article : ${articles}" class="article-row">
        <a th:href="@{'/article/' + ${article.id}}" class="article-title" th:text="${article.title}">Title</a>
        <span class="article-date" th:text="${#temporals.format(article.publishDate, 'dd/MM/yyyy HH:mm')}">Date</span>
    </div>
</div>
</body>
</html>
