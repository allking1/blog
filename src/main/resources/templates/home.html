<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- CỰC KỲ QUAN TRỌNG: Thẻ này giúp web co giãn đúng kích thước màn hình điện thoại -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Blog</title>
    <style>
        * { box-sizing: border-box; } /* Ép tất cả phần tử không bị phình to do padding/border */
        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            padding: 20px; /* Thu gọn khoảng cách 2 bên cho mobile */
            margin: 0;
        }
        .mockup-container {
            background-color: white;
            border: 3px solid #222;
            border-radius: 6px;
            width: 100%;
            max-width: 500px;
            padding: 20px 25px; /* Căn chỉnh lại padding cho đều */
        }
        h1 {
            font-size: clamp(24px, 6vw, 32px); /* Tự động thu nhỏ font trên điện thoại */
            margin: 0 0 25px 0;
            color: #222;
        }
        .article-row {
            display: flex;
            justify-content: space-between;
            align-items: center; /* Ép mọi thứ nằm trên 1 đường thẳng ngang */
            margin-bottom: 15px;
            gap: 15px; /* Giữ khoảng cách giữa Tiêu đề và Ngày tháng */
        }
        .article-title {
            text-decoration: none;
            color: #222;
            font-size: 18px;
            font-weight: bold;
            flex: 1; /* Chiếm toàn bộ không gian còn lại */
            word-break: break-word; /* Nếu tiêu đề quá dài không có dấu cách, tự động xuống dòng */
        }
        .article-title:hover { text-decoration: underline; }
        .article-date {
            color: #999;
            font-size: 15px;
            font-weight: bold;
            flex-shrink: 0; /* Cấm ngày tháng bị ép co dúm lại khi tiêu đề quá dài */
        }
        .empty-msg { color: #777; font-style: italic; }
    </style>
</head>
<body>
<div class="mockup-container">
    <h1>Personal Blog</h1>
    <div th:if="${#lists.isEmpty(articles)}" class="empty-msg">
        <p>No articles yet.</p>
    </div>
    <div th:each="article : ${articles}" class="article-row">
        <a th:href="@{'/article/' + ${article.id}}" class="article-title" th:text="${article.title}">My first article</a>
        <span class="article-date" th:text="${#temporals.format(article.time, 'MMMM d, yyyy')}">August 7, 2024</span>
    </div>
</div>
</body>
</html>
