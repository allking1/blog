<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Article</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .mockup-container { background-color: white; border: 3px solid #222; border-radius: 6px; width: 100%; max-width: 500px; padding: 20px 25px; }
        h1 { font-size: 26px; margin: 0 0 25px 0; color: #222; }

        .form-group { margin-bottom: 20px; width: 100%; }
        /* Tối ưu form cho di động */
        input[type="text"], textarea { width: 100%; border: 3px solid #222; border-radius: 4px; padding: 12px; font-family: inherit; font-size: 16px; outline: none; }
        textarea { height: 250px; resize: vertical; }

        .submit-btn { border: 3px solid #222; background: white; padding: 10px 25px; border-radius: 4px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; /* Nút full ngang trên mobile */ }
        .submit-btn:hover { background: #eee; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #555; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
<div class="mockup-container">
    <a th:href="@{/admin}" class="back-link">← Back</a>
    <h1>New Article</h1>
    <form th:action="@{/admin/new}" method="post">
        <div class="form-group">
            <input type="text" name="title" placeholder="Article Title" required>
        </div>
        <div class="form-group">
            <textarea name="content" placeholder="Content" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Publish</button>
    </form>
</div>
</body>
</html>
